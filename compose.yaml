name: litmus-sns

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: pnpm --filter web dev --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: pnpm --filter api dev
    ports:
      - "8080:8080"
