name: litmus-sns

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: pnpm --filter web dev --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    # 起動のたびに未適用のマイグレーションを適用する。失敗したら api は起動しない
    command: sh -c "pnpm --filter api migrate && pnpm --filter api dev"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/litmus_sns
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/postgres
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: litmus_sns
      # ボリューム直下に lost+found 等があっても initdb が失敗しないよう、サブディレクトリに置く
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litmus_sns"]
      interval: 3s
      timeout: 3s
      retries: 20

  # メール確認用。UI は http://localhost:8025、SMTP は localhost:1025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # 画像ストレージ（S3 互換）。コンソールは http://localhost:9001、API は localhost:9000
  minio:
    build:
      context: .
      dockerfile: docker/Dockerfile.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
